name: Buildroot Cached

on:
  workflow_dispatch:
    inputs:
      ssh_session:
        description: 'SSH after build?'
        required: false
        default: 'false'

env:
  BR2_VERSION: "2024.02.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ env.BR2_VERSION }}-${{ hashFiles('**/*.config') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.BR2_VERSION }}-
            ccache-${{ runner.os }}-

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: buildroot/dl
          key: br-dl-${{ env.BR2_VERSION }}-${{ hashFiles('buildroot/configs/*') }}
          restore-keys: br-dl-${{ env.BR2_VERSION }}-

      - name: Cache Buildroot build
        uses: actions/cache@v4
        with:
          path: buildroot/output/build
          key: br-build-${{ env.BR2_VERSION }}-${{ hashFiles('buildroot/configs/*') }}
          restore-keys: br-build-${{ env.BR2_VERSION }}-

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ gcc git bison flex \
            libncurses5-dev libncursesw5-dev \
            libssl-dev wget cpio unzip rsync bc \
            qemu-utils qemu-system-aarch64 file

      - name: Clone Buildroot
        run: |
          git clone --depth 1 --branch $BR2_VERSION https://github.com/buildroot/buildroot.git

      - name: Apply config
        run: |
          cd buildroot
          make qemu_aarch64_virt_defconfig
          
          # Enable external toolchain (saves 15-20 min)
          sed -i 's/# BR2_TOOLCHAIN_EXTERNAL is not set/BR2_TOOLCHAIN_EXTERNAL=y/' .config
          sed -i 's/# BR2_TOOLCHAIN_EXTERNAL_BOOTLIN is not set/BR2_TOOLCHAIN_EXTERNAL_BOOTLIN=y/' .config
          sed -i 's/BR2_TOOLCHAIN_EXTERNAL_BOOTLIN_ARCH=.*/BR2_TOOLCHAIN_EXTERNAL_BOOTLIN_ARCH="aarch64"/' .config
          sed -i 's/BR2_TOOLCHAIN_EXTERNAL_BOOTLIN_VARIANT=.*/BR2_TOOLCHAIN_EXTERNAL_BOOTLIN_VARIANT="musl"/' .config
          
          # Enable ccache
          sed -i 's/# BR2_CCACHE is not set/BR2_CCACHE=y/' .config
          
          # Enable packages that ACTUALLY EXIST in Buildroot
          cat >> .config << 'EOF'
          BR2_PACKAGE_BASH=y
          BR2_PACKAGE_VIM=y
          BR2_PACKAGE_NANO=y
          BR2_PACKAGE_HTOP=y
          BR2_PACKAGE_OPENSSH=y
          BR2_PACKAGE_DROPBEAR=y
          BR2_PACKAGE_WGET=y
          BR2_PACKAGE_CURL=y
          BR2_PACKAGE_IPROUTE2=y
          BR2_PACKAGE_IPTABLES=y
          BR2_PACKAGE_TCPDUMP=y
          BR2_PACKAGE_SOCAT=y
          BR2_PACKAGE_NETCAT=y
          BR2_PACKAGE_RSYNC=y
          BR2_PACKAGE_PYTHON3=y
          BR2_PACKAGE_STRACE=y
          BR2_PACKAGE_BINUTILS=y
          BR2_PACKAGE_E2FSPROGS=y
          BR2_PACKAGE_DOSFSTOOLS=y
          BR2_PACKAGE_MTOOLS=y
          BR2_PACKAGE_ZSTD=y
          BR2_PACKAGE_XZ=y
          BR2_PACKAGE_LZ4=y
          BR2_PACKAGE_GZIP=y
          BR2_PACKAGE_UTIL_LINUX=y
          BR2_PACKAGE_PCIUTILS=y
          BR2_PACKAGE_USBUTILS=y
          BR2_PACKAGE_OPENSSL=y
          BR2_PACKAGE_SCREEN=y
          BR2_PACKAGE_TMUX=y
          BR2_PACKAGE_MC=y
          BR2_PACKAGE_NCURSES=y
          BR2_PACKAGE_NCURSES_WCHAR=y
          BR2_TARGET_ROOTFS_CPIO_GZIP=y
          BR2_TARGET_ROOTFS_EXT2=y
          BR2_TARGET_ROOTFS_TAR=y
          EOF
          
          make olddefconfig

      - name: Build
        run: |
          cd buildroot
          make -j$(nproc) 2>&1 | tee build.log

      - name: Inspect output
        if: always()
        run: |
          ls -lah buildroot/output/images/ 2>/dev/null || echo "No output/images dir"
          ls -lah buildroot/output/ 2>/dev/null || true
          tail -50 buildroot/build.log 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-images
          path: |
            buildroot/output/images/
            buildroot/build.log
          retention-days: 7
          if-no-files-found: warn

      - name: Setup tmate
        if: ${{ github.event.inputs.ssh_session == 'true' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
